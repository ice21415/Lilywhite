name: Build RootHide package

on:
  push:
    branches: [main]
    paths:
      - Tweak.xm
      - Makefile
      - control
      - Lilywhite.plist
      - .github/workflows/build-roothide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install signing tool and RootHide Theos
        run: |
          {
            brew install ldid
            git clone --recursive https://github.com/roothide/theos.git "$HOME/roothide-theos"
            export THEOS="$HOME/roothide-theos"
            "$THEOS/bin/install-sdk" latest
          } 2>&1 | tee setup.log

      - name: Build arm64e package with Apple toolchain
        run: |
          set -o pipefail
          export THEOS="$HOME/roothide-theos"
          mkdir -p build-packages
          make clean package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 2>&1 | tee build.log

      - name: Publish build diagnostic
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f *.log || true
          git diff --cached --quiet || git commit -m "Publish macOS build diagnostic"
          git push origin HEAD:main || true

      - name: Annotate build failure
        if: failure()
        run: |
          summary=$(tr '\n' ' ' < build.log)
          echo "::error title=Lilywhite macOS build output::$summary"

      - name: Upload build diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lilywhite-build-diagnostic
          path: build.log
          if-no-files-found: error
          retention-days: 1

      - name: Upload package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lilywhite-roothide-package
          path: build-packages/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: Publish package binary
        run: |
          cp build-packages/*.deb .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.deb
          git diff --cached --quiet || git commit -m "Build Lilywhite 0.1.3 RootHide package"
          git push origin HEAD:main
